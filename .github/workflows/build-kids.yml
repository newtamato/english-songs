name: Build Kids APK Skeleton

on:
  push:
    paths: ['build-kids/**', '.github/workflows/build-kids.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-33 build-tools;33.0.2' }

      - name: Create project from source
        run: |
          mkdir -p app/src/main/java/com/happyzh/kids app/src/main/res/values app/src/main/assets
          cp build-kids/app/src/main/AndroidManifest.xml app/src/main/
          cp build-kids/app/src/main/java/com/happyzh/kids/MainActivity.java app/src/main/java/com/happyzh/kids/
          cp build-kids/app/src/main/res/values/styles.xml app/src/main/res/values/
          cp build-kids/app/src/main/assets/index.html app/src/main/assets/
          cp build-kids/build.gradle .
          cp build-kids/app/build.gradle app/
          cp build-kids/settings.gradle .
          cp build-kids/gradle.properties .

      - name: Build
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with: { name: kids-skeleton, path: app/build/outputs/apk/debug/app-debug.apk }
