name: Build Math Kids APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create project
        run: |
          PKG=com/happyzh/mathkids
          mkdir -p app/src/main/java/$PKG
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="快乐数学"
                  android:theme="@style/Theme.App"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/$PKG/MainActivity.java << 'JAVAEOF'
          package com.happyzh.mathkids;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.*;
          import android.webkit.*;
          public class MainActivity extends Activity {
              private WebView wv;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  wv = new WebView(this);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setSupportZoom(false);
                  ws.setBuiltInZoomControls(false);
                  ws.setDisplayZoomControls(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("file:///android_asset/math-kids.html");
                  setContentView(wv);
              }
          }
          JAVAEOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#ff9a9e</item>
                  <item name="android:navigationBarColor">#ff9a9e</item>
              </style>
          </resources>
          EOF

          cp kids-videos/math-kids.html app/src/main/assets/math-kids.html

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.mathkids'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.mathkids"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "MathKids"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-kids-apk
          path: app/build/outputs/apk/debug/app-debug.apk
