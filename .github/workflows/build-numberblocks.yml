name: Build Numberblocks APK

on:
  push:
    paths: ['.github/workflows/build-numberblocks.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create Android project
        run: |
          PKG=com/happyzh/numberblocks
          mkdir -p app/src/main/java/$PKG
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/drawable

          # ---- AndroidManifest.xml ----
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:label="Numberblocks"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.App"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize"
                      android:theme="@style/Theme.Player" />
              </application>
          </manifest>
          EOF

          # ---- MainActivity.java (episode list) ----
          cat > app/src/main/java/$PKG/MainActivity.java << 'JAVAEOF'
          package com.happyzh.numberblocks;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.app.Activity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import java.io.File;
          import java.util.*;
          public class MainActivity extends Activity {
              private static final String VIDEO_DIR = "/sdcard/Numberblocks";
              private List<File> videos = new ArrayList<>();
              private LinearLayout listView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 23) {
                      if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)
                              != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
                      }
                  }
                  setContentView(createMainView());
                  scanVideos();
              }

              private LinearLayout createMainView() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF1a1a2e);

                  // Title bar
                  TextView title = new TextView(this);
                  title.setText("🔢 Numberblocks");
                  title.setTextSize(28);
                  title.setTextColor(0xFFFFFFFF);
                  title.setPadding(32, 40, 32, 24);
                  title.setBackgroundColor(0xFF16213e);
                  root.addView(title);

                  // Scrollable list
                  ScrollView scroll = new ScrollView(this);
                  listView = new LinearLayout(this);
                  listView.setOrientation(LinearLayout.VERTICAL);
                  listView.setPadding(16, 16, 16, 16);
                  scroll.addView(listView);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));
                  return root;
              }

              private void scanVideos() {
                  videos.clear();
                  listView.removeAllViews();
                  File dir = new File(VIDEO_DIR);
                  if (!dir.exists()) {
                      TextView msg = new TextView(this);
                      msg.setText("请将视频放到\n/sdcard/Numberblocks/\n\n然后重启App");
                      msg.setTextSize(18);
                      msg.setTextColor(0xFFaaaaaa);
                      msg.setPadding(32, 60, 32, 60);
                      msg.setGravity(android.view.Gravity.CENTER);
                      listView.addView(msg);
                      return;
                  }
                  File[] files = dir.listFiles((d, name) ->
                      name.endsWith(".mp4") || name.endsWith(".mkv") || name.endsWith(".avi"));
                  if (files == null || files.length == 0) {
                      TextView msg = new TextView(this);
                      msg.setText("没有找到视频文件\n请将 .mp4 文件放入\n/sdcard/Numberblocks/");
                      msg.setTextSize(18);
                      msg.setTextColor(0xFFaaaaaa);
                      msg.setPadding(32, 60, 32, 60);
                      msg.setGravity(android.view.Gravity.CENTER);
                      listView.addView(msg);
                      return;
                  }
                  Arrays.sort(files, (a, b) -> a.getName().compareTo(b.getName()));
                  videos.addAll(Arrays.asList(files));

                  for (int i = 0; i < videos.size(); i++) {
                      File v = videos.get(i);
                      String name = v.getName().replaceFirst("\\.[^.]+$", "")
                          .replaceAll("[_\\.-]", " ").trim();
                      // Capitalize first letter of each word
                      StringBuilder sb = new StringBuilder();
                      for (String w : name.split(" ")) {
                          if (w.length() > 0)
                              sb.append(Character.toUpperCase(w.charAt(0)))
                                .append(w.substring(1)).append(" ");
                      }
                      name = sb.toString().trim();

                      final int idx = i;
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setPadding(20, 18, 20, 18);
                      row.setGravity(android.view.Gravity.CENTER_VERTICAL);
                      row.setBackgroundColor(i % 2 == 0 ? 0xFF16213e : 0xFF0f3460);
                      row.setOnClickListener(vv -> playVideo(idx));

                      TextView num = new TextView(this);
                      num.setText(String.format("%02d", i + 1));
                      num.setTextSize(22);
                      num.setTextColor(0xFFe94560);
                      num.setPadding(0, 0, 20, 0);
                      row.addView(num);

                      TextView label = new TextView(this);
                      label.setText(name);
                      label.setTextSize(18);
                      label.setTextColor(0xFFeeeeee);
                      row.addView(label, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1));

                      listView.addView(row);
                  }
              }

              private void playVideo(int index) {
                  Intent intent = new Intent(this, PlayerActivity.class);
                  intent.setData(Uri.fromFile(videos.get(index)));
                  intent.putExtra("title", videos.get(index).getName());
                  startActivity(intent);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  scanVideos();
              }
          }
          JAVAEOF

          # ---- PlayerActivity.java ----
          cat > app/src/main/java/$PKG/PlayerActivity.java << 'JAVAEOF'
          package com.happyzh.numberblocks;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.*;
          public class PlayerActivity extends Activity {
              private VideoView videoView;
              private boolean isPlaying = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);

                  videoView = new VideoView(this);
                  root.addView(videoView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT));

                  Uri uri = getIntent().getData();
                  if (uri != null) {
                      videoView.setVideoURI(uri);
                      videoView.setOnPreparedListener(mp -> {
                          videoView.start();
                          mp.setLooping(false);
                      });
                      videoView.setOnCompletionListener(mp -> finish());
                      videoView.setOnErrorListener((mp, what, extra) -> {
                          Toast.makeText(this, "播放失败", Toast.LENGTH_SHORT).show();
                          finish();
                          return true;
                      });
                  }

                  // Tap to toggle play/pause
                  videoView.setOnClickListener(v -> {
                      if (isPlaying) {
                          videoView.pause();
                      } else {
                          videoView.start();
                      }
                      isPlaying = !isPlaying;
                  });

                  setContentView(root);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (videoView != null && videoView.isPlaying()) {
                      videoView.pause();
                      isPlaying = false;
                  }
              }
          }
          JAVAEOF

          # ---- Styles ----
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">#1a1a2e</item>
              </style>
              <style name="Theme.Player" parent="android:Theme.Black.NoTitleBar.Fullscreen" />
          </resources>
          EOF

          # ---- Launcher icon (simple colored shape) ----
          # Generate simple launcher icon
          python3 -c "
from PIL import Image, ImageDraw
img = Image.new('RGB', (192,192), '#e94560')
d = ImageDraw.Draw(img)
d.rectangle([20,40,60,170], fill='#ffffff')
d.rectangle([70,40,110,170], fill='#0f3460')
d.rectangle([120,40,160,170], fill='#ffffff')
img.save('app/src/main/res/mipmap-hdpi/ic_launcher.png')
" 2>/dev/null || echo "Pillow not available, skipping icon"

          # ---- Build files ----
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.numberblocks'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.numberblocks"
                  minSdk 21; targetSdk 33; versionCode 1; versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "Numberblocks"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: numberblocks
          path: app/build/outputs/apk/debug/app-debug.apk
