name: Build Numberblocks APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create Android project
        run: |
          PKG=com/happyzh/numberblocks
          mkdir -p app/src/main/java/$PKG
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ---- AndroidManifest.xml ----
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Numberblocks"
                  android:theme="@style/Theme.App"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ---- MainActivity.java ----
          cat > app/src/main/java/$PKG/MainActivity.java << 'JAVAEOF'
          package com.happyzh.numberblocks;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.*;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              private WebView wv;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);

                  wv = new WebView(this);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          setContentView(view);
                      }
                  });
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }

              @Override
              public void onBackPressed() {
                  if (wv.canGoBack() && wv.getUrl() != null
                      && !wv.getUrl().contains("player.bilibili.com")) {
                      wv.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVAEOF

          # ---- index.html (main UI + player) ----
          cat > app/src/main/assets/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{background:#0a0a1a;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
          .header{text-align:center;padding:40px 20px 30px;background:linear-gradient(135deg,#1a1a3e,#0d0d2b)}
          .header h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:2px}
          .header h1 span{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
          .header p{color:#8888aa;margin-top:8px;font-size:14px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px;max-width:1200px;margin:0 auto}
          .card{border-radius:24px;padding:28px 24px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
          .card:active{transform:scale(.96)}
          .card .num{position:absolute;top:16px;right:20px;font-size:72px;font-weight:900;opacity:.15;color:#fff}
          .card .season{font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:3px;margin-bottom:6px}
          .card .title{font-size:24px;font-weight:800;color:#fff;margin-bottom:4px}
          .card .dur{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:8px}
          .card .play-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:8px 18px;border-radius:20px;font-size:14px;color:#fff;backdrop-filter:blur(4px);width:fit-content}
          .card:nth-child(1){background:linear-gradient(135deg,#e94560,#c23152)}
          .card:nth-child(2){background:linear-gradient(135deg,#0f3460,#16213e)}
          .card:nth-child(3){background:linear-gradient(135deg,#533483,#3b1f6e)}
          .card:nth-child(4){background:linear-gradient(135deg,#1a936f,#114b3e)}
          .card:nth-child(5){background:linear-gradient(135deg,#e76f51,#c14c2c)}
          .player-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999}
          .player-overlay iframe{width:100%;height:100%;border:none}
          .close-btn{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
          .loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;z-index:9998;background:rgba(0,0,0,.7);padding:16px 32px;border-radius:12px}
          @media(max-width:600px){.grid{grid-template-columns:1fr}.card{min-height:140px}.card .title{font-size:20px}}
          </style>
          </head>
          <body>

          <div class="header">
            <h1><span>Numberblocks</span></h1>
            <p>数字积木 · 1-5季 · 中文配音</p>
          </div>

          <div class="grid" id="grid"></div>
          <div class="loading" id="loading">加载中...</div>
          <div class="player-overlay" id="player">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <div id="playerContainer" style="width:100%;height:100%"></div>
          </div>

          <script>
          const BVID = 'BV1DiYYzkEWY';
          const EPISODES = [
            {season:'Season 1',title:'第一季',dur:'95分钟',page:1,cid:'31732138151'},
            {season:'Season 2',title:'第二季',dur:'237分钟',page:2,cid:'31732141725'},
            {season:'Season 3',title:'第三季',dur:'157分钟',page:3,cid:'31732204146'},
            {season:'Season 4',title:'第四季',dur:'240分钟',page:4,cid:'31732271722'},
            {season:'Season 5',title:'第五季',dur:'68分钟',page:5,cid:'31732335213'}
          ];

          function buildCards() {
            var g = document.getElementById('grid');
            EPISODES.forEach(function(ep, i) {
              var card = document.createElement('div');
              card.className = 'card';
              card.onclick = function(){ playEpisode(i); };
              card.innerHTML =
                '<div class="num">'+(i+1)+'</div>'+
                '<div class="season">'+ep.season+'</div>'+
                '<div class="title">'+ep.title+'</div>'+
                '<div class="dur">▶ '+ep.dur+'</div>'+
                '<div class="play-btn">▶ 播放</div>';
              g.appendChild(card);
            });
          }

          function playEpisode(index) {
            var ep = EPISODES[index];
            var loading = document.getElementById('loading');
            var player = document.getElementById('player');
            loading.style.display = 'block';
            player.style.display = 'block';

            var container = document.getElementById('playerContainer');
            container.innerHTML = '<iframe src="https://player.bilibili.com/player.html'+
              '?bvid='+BVID+'&page='+ep.page+
              '&autoplay=1&high_quality=1&danmaku=0'+
              '" allow="autoplay;fullscreen" allowfullscreen></iframe>';

            setTimeout(function(){ loading.style.display = 'none'; }, 2500);
          }

          function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('playerContainer').innerHTML = '';
          }

          buildCards();
          </script>
          </body>
          </html>
          HTMLEOF

          # ---- Styles ----
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Black.NoTitleBar.Fullscreen" />
          </resources>
          EOF

          # ---- Build files ----
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.numberblocks'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.numberblocks"
                  minSdk 21; targetSdk 33; versionCode 3; versionName "2.0"
              }
              buildTypes { debug { minifyEnabled false } }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "Numberblocks"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: numberblocks
          path: app/build/outputs/apk/debug/app-debug.apk
