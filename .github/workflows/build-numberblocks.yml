name: Build Numberblocks APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create Android project
        run: |
          PKG=com/happyzh/numberblocks
          mkdir -p app/src/main/java/$PKG
          mkdir -p app/src/main/res/values

          # ---- AndroidManifest.xml ----
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Numberblocks"
                  android:theme="@style/Theme.App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize"
                      android:theme="@style/Theme.Player" />
              </application>
          </manifest>
          EOF

          # ---- MainActivity.java ----
          cat > app/src/main/java/$PKG/MainActivity.java << 'JAVAEOF'
          package com.happyzh.numberblocks;
          import android.app.Activity;
          import android.app.ProgressDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.AsyncTask;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import javax.net.ssl.*;
          import org.json.*;
          public class MainActivity extends Activity {
              private static final String BVID = "BV1DiYYzkEWY";
              private static final String[][] EPISODES = {
                  {"第一季", "31732138151", "95分钟"},
                  {"第二季", "31732141725", "237分钟"},
                  {"第三季", "31732204146", "157分钟"},
                  {"第四季", "31732271722", "240分钟"},
                  {"第五季", "31732335213", "68分钟"},
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF1a1a2e);

                  TextView title = new TextView(this);
                  title.setText("Numberblocks 数字积木");
                  title.setTextSize(24);
                  title.setTextColor(0xFFFFFFFF);
                  title.setPadding(32, 40, 32, 20);
                  title.setBackgroundColor(0xFF16213e);
                  root.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("1-5季 · 中文配音 · 数学英语启蒙");
                  sub.setTextSize(13);
                  sub.setTextColor(0xFF888899);
                  sub.setPadding(32, 0, 32, 24);
                  sub.setBackgroundColor(0xFF16213e);
                  root.addView(sub);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  list.setPadding(16, 16, 16, 80);
                  scroll.addView(list);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  int[] colors = {0xFFe94560, 0xFF0f3460, 0xFF533483, 0xFF16213e, 0xFF1a936f};
                  for (int i = 0; i < EPISODES.length; i++) {
                      final int idx = i;
                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(24, 22, 24, 22);
                      card.setBackgroundColor(colors[i]);
                      int m = 18;
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(8, m, 8, 0);
                      card.setLayoutParams(lp);
                      card.setOnClickListener(v -> loadAndPlay(idx));

                      TextView num = new TextView(this);
                      num.setText("Season " + (i + 1));
                      num.setTextSize(14);
                      num.setTextColor(0xAAFFFFFF);
                      card.addView(num);

                      TextView name = new TextView(this);
                      name.setText(EPISODES[i][0]);
                      name.setTextSize(22);
                      name.setTextColor(0xFFFFFFFF);
                      name.setPadding(0, 4, 0, 4);
                      card.addView(name);

                      TextView dur = new TextView(this);
                      dur.setText("▶ " + EPISODES[i][2]);
                      dur.setTextSize(13);
                      dur.setTextColor(0xAAFFFFFF);
                      card.addView(dur);

                      list.addView(card);
                  }

                  setContentView(root);
              }

              private void loadAndPlay(int index) {
                  ProgressDialog pd = ProgressDialog.show(this, "", "获取播放地址...", true);
                  new AsyncTask<Integer, Void, String>() {
                      @Override
                      protected String doInBackground(Integer... idx) {
                          try {
                              String cid = EPISODES[idx[0]][1];
                              String api = "https://api.bilibili.com/x/player/playurl"
                                  + "?bvid=" + BVID + "&cid=" + cid + "&qn=80&fnval=1&fourk=1";
                              URL url = new URL(api);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0");
                              conn.setRequestProperty("Referer", "https://www.bilibili.com");
                              conn.setConnectTimeout(8000);
                              conn.setReadTimeout(8000);
                              BufferedReader br = new BufferedReader(
                                  new InputStreamReader(conn.getInputStream()));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = br.readLine()) != null) sb.append(line);
                              br.close();
                              JSONObject json = new JSONObject(sb.toString());
                              return json.getJSONObject("data").getJSONArray("durl")
                                  .getJSONObject(0).getString("url");
                          } catch (Exception e) { return null; }
                      }
                      @Override
                      protected void onPostExecute(String url) {
                          pd.dismiss();
                          if (url != null) {
                              Intent intent = new Intent(MainActivity.this, PlayerActivity.class);
                              intent.setData(Uri.parse(url));
                              startActivity(intent);
                          } else {
                              Toast.makeText(MainActivity.this,
                                  "加载失败，检查网络连接", Toast.LENGTH_SHORT).show();
                          }
                      }
                  }.execute(index);
              }
          }
          JAVAEOF

          # ---- PlayerActivity.java ----
          cat > app/src/main/java/$PKG/PlayerActivity.java << 'JAVAEOF'
          package com.happyzh.numberblocks;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.*;
          public class PlayerActivity extends Activity {
              private VideoView videoView;
              private boolean isPlaying = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);

                  videoView = new VideoView(this);
                  root.addView(videoView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  Uri uri = getIntent().getData();
                  if (uri != null) {
                      videoView.setVideoURI(uri);
                      videoView.setOnPreparedListener(mp -> { videoView.start(); });
                      videoView.setOnCompletionListener(mp -> finish());
                      videoView.setOnErrorListener((mp, w, e) -> {
                          Toast.makeText(this, "播放失败", Toast.LENGTH_SHORT).show();
                          finish(); return true;
                      });
                  }

                  videoView.setOnClickListener(v -> {
                      if (isPlaying) { videoView.pause(); }
                      else { videoView.start(); }
                      isPlaying = !isPlaying;
                  });

                  setContentView(root);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (videoView != null && videoView.isPlaying()) {
                      videoView.pause(); isPlaying = false;
                  }
              }
          }
          JAVAEOF

          # ---- Styles ----
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">#1a1a2e</item>
              </style>
              <style name="Theme.Player" parent="android:Theme.Black.NoTitleBar.Fullscreen" />
          </resources>
          EOF

          # ---- Build files ----
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.numberblocks'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.numberblocks"
                  minSdk 21; targetSdk 33; versionCode 2; versionName "1.1"
              }
              buildTypes { debug { minifyEnabled false } }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "Numberblocks"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: numberblocks
          path: app/build/outputs/apk/debug/app-debug.apk
