            {c:'以',py:'yǐ',cat:'common'},{c:'为',py:'wèi',cat:'common'},
            {c:'因',py:'yīn',cat:'common'},{c:'没',py:'méi',cat:'common'},
            {c:'不',py:'bù',cat:'common'},{c:'在',py:'zài',cat:'common'},
            {c:'着',py:'zhe',cat:'common'},{c:'了',py:'le',cat:'common'},
            {c:'吗',py:'ma',cat:'common'},{c:'呢',py:'ne',cat:'common'},
            {c:'吧',py:'ba',cat:'common'},{c:'呀',py:'yā',cat:'common'},
            {c:'么',py:'me',cat:'common'},{c:'什',py:'shén',cat:'common'},
            {c:'这',py:'zhè',cat:'common'},{c:'那',py:'nà',cat:'common'},
            {c:'各',py:'gè',cat:'common'},{c:'样',py:'yàng',cat:'common'},
            {c:'种',py:'zhǒng',cat:'common'},{c:'还',py:'hái',cat:'common'},
            {c:'要',py:'yào',cat:'common'},{c:'点',py:'diǎn',cat:'common'},
            {c:'常',py:'cháng',cat:'common'},{c:'非',py:'fēi',cat:'common'},
            {c:'别',py:'bié',cat:'common'},{c:'干',py:'gàn',cat:'common'},
            {c:'之',py:'zhī',cat:'common'},
            {c:'亮',py:'liàng',cat:'common'},{c:'直',py:'zhí',cat:'common'},
            {c:'爱',py:'ài',cat:'common'},{c:'尖',py:'jiān',cat:'common'},{c:'角',py:'jiǎo',cat:'common'},
            {c:'吓',py:'xià',cat:'common'},{c:'怕',py:'pà',cat:'common'},
            {c:'跟',py:'gēn',cat:'common'},{c:'条',py:'tiáo',cat:'common'},
            {c:'成',py:'chéng',cat:'common'},{c:'就',py:'jiù',cat:'common'},
            {c:'低',py:'dī',cat:'common'},{c:'思',py:'sī',cat:'common'},
            {c:'块',py:'kuài',cat:'common'},{c:'往',py:'wǎng',cat:'common'},
            {c:'连',py:'lián',cat:'common'},{c:'许',py:'xǔ',cat:'common'},
            {c:'让',py:'ràng',cat:'common'},{c:'给',py:'gěi',cat:'common'},
            {c:'居',py:'jū',cat:'common'},{c:'单',py:'dān',cat:'common'},
            {c:'请',py:'qǐng',cat:'common'},{c:'情',py:'qíng',cat:'common'},
            {c:'晴',py:'qíng',cat:'common'},{c:'清',py:'qīng',cat:'common'},
            {c:'生',py:'shēng',cat:'common'},{c:'造',py:'zào',cat:'common'},
            {c:'运',py:'yùn',cat:'common'},{c:'欢',py:'huān',cat:'common'},
            {c:'夕',py:'xī',cat:'common'},{c:'香',py:'xiāng',cat:'common'},
            {c:'声',py:'shēng',cat:'common'},{c:'是',py:'shì',cat:'common'},
            {c:'正',py:'zhèng',cat:'common'},{c:'比',py:'bǐ',cat:'common'},
            {c:'巴',py:'bā',cat:'common'},{c:'把',py:'bǎ',cat:'common'},
            {c:'从',py:'cóng',cat:'common'},{c:'才',py:'cái',cat:'common'},
            {c:'笑',py:'xiào',cat:'common'},{c:'分',py:'fēn',cat:'common'}
          ];

          var currentWord = null;
          var writer = null;
          var quizActive = false;

          // ---- Build character picker ----
          var cats = {
            numbers: document.getElementById('gridNumbers'),
            nature: document.getElementById('gridNature'),
            body: document.getElementById('gridBody'),
            animal: document.getElementById('gridAnimal'),
            people: document.getElementById('gridPeople'),
            actions: document.getElementById('gridActions'),
            school: document.getElementById('gridSchool'),
            common: document.getElementById('gridCommon')
          };

          WORDS.forEach(function(w) {
            var btn = document.createElement('button');
            btn.className = 'char-card';
            btn.textContent = w.c;
            btn.onclick = function() { pickChar(w); };
            cats[w.cat].appendChild(btn);
          });

          function pickChar(w) {
            currentWord = w;
            quizActive = false;

            // Slide away picker
            document.getElementById('screenPicker').classList.add('hidden');
            document.getElementById('screenTrace').classList.add('active');

            // Setup trace screen
            document.getElementById('traceChar').textContent = w.c;
            document.getElementById('tracePy').textContent = w.py;
            document.getElementById('traceMsg').textContent = '';
            document.getElementById('strokeCounter').textContent = '';
            document.getElementById('writer-target').innerHTML = '';

            // Show spinner while loading
            var spinner = document.getElementById('spinner');
            spinner.classList.add('show');
            setTimeout(function() { spinner.classList.remove('show'); }, 4000);

            // Create writer (data loads async from CDN)
            writer = HanziWriter.create('writer-target', w.c, {
              width: 340, height: 340, padding: 35,
              strokeColor: 'rgba(44,24,16,.3)',
              outlineColor: 'rgba(139,69,19,.45)',
              highlightColor: 'rgba(139,69,19,.15)',
              drawingColor: '#c0392b',
              drawingWidth: 7,
              showCharacter: true,
              showHintAfterMisses: 2,
              leniency: 1.3,
              acceptBackwardsStrokes: true,
              markStrokeCorrectAfterMisses: 5,
              highlightOnComplete: true,
              onLoadCharDataSuccess: function() {
                spinner.classList.remove('show');
                document.getElementById('traceMsg').textContent = '点击「开始描红」或「看笔顺」';
              },
              onLoadCharDataError: function(err) {
                spinner.classList.remove('show');
                document.getElementById('traceMsg').textContent = '加载失败，请检查网络';
              }
            });
          }

          function showAnimation() {
            if (!writer) return;
            quizActive = false;
            document.getElementById('traceMsg').textContent = '🎬 注意看笔顺...';
            writer.animateCharacter({
              onComplete: function() {
                document.getElementById('traceMsg').textContent = '笔顺演示完毕，点击「开始描红」';
              }
            });
          }

          function startQuiz() {
            if (!writer) return;
            quizActive = true;
            document.getElementById('traceMsg').textContent = '跟着描 ✍️';
            document.getElementById('strokeCounter').textContent = '';
            writer.quiz({
              onCorrectStroke: function(data) {
                document.getElementById('traceMsg').textContent = '✅ 好！';
                document.getElementById('strokeCounter').textContent =
                  '第 ' + data.strokeNum + ' / ' + data.totalStrokes + ' 笔';
              },
              onMistake: function(data) {
                document.getElementById('traceMsg').textContent = '🔄 再描一次';
              },
              onComplete: function(data) {
                quizActive = false;
                document.getElementById('traceMsg').textContent = '';
                showFireworks();
              }
            });
          }

          function clearDrawing() {
            if (!writer) return;
            quizActive = false;
            document.getElementById('writer-target').innerHTML = '';
            writer = null;
            writer = HanziWriter.create('writer-target', currentWord.c, {
              width: 340, height: 340, padding: 35,
              strokeColor: 'rgba(44,24,16,.3)',
              outlineColor: 'rgba(139,69,19,.45)',
              highlightColor: 'rgba(139,69,19,.15)',
              drawingColor: '#c0392b',
              drawingWidth: 7,
              showCharacter: true,
              showHintAfterMisses: 2,
              leniency: 1.3,
              acceptBackwardsStrokes: true,
              markStrokeCorrectAfterMisses: 5,
              highlightOnComplete: true
            });
            document.getElementById('traceMsg').textContent = '已清除，重新开始';
            document.getElementById('strokeCounter').textContent = '';
          }

          function playVictorySound() {
            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              var notes = [523, 659, 784, 1047];
              notes.forEach(function(freq, i) {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.4);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime + i * 0.15);
                osc.stop(ctx.currentTime + i * 0.15 + 0.4);
              });
            } catch(e) {}
          }

          function showFireworks() {
            playVictorySound();
            var fw = document.getElementById('fireworks');
            document.getElementById('fwCharName').textContent = '「' + currentWord.c + '」写好了！';
            fw.classList.add('show');

            // Spawn particles
            for (var i = 0; i < 50; i++) {
              var p = document.createElement('div');
              p.className = 'particle';
              var colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#e64980','#20c997','#ffd43b'];
              p.style.cssText =
                'left:'+(30+Math.random()*40)+'%;top:'+(30+Math.random()*40)+'%;'+
                'width:'+(6+Math.random()*10)+'px;height:'+(6+Math.random()*10)+'px;'+
                'background:'+colors[Math.floor(Math.random()*colors.length)]+';'+
                '--x:'+((Math.random()-.5)*300)+'px;--y:'+((Math.random()-.5)*300)+'px';
              document.body.appendChild(p);
              setTimeout(function() { p.remove(); }, 1000);
            }
          }

          function hideFireworks() {
            document.getElementById('fireworks').classList.remove('show');
          }

          function retryChar() {
            hideFireworks();
            clearDrawing();
            setTimeout(function() { startQuiz(); }, 500);
          }

          function nextChar() {
            hideFireworks();
            var idx = WORDS.indexOf(currentWord);
            var next = WORDS[(idx + 1) % WORDS.length];
            pickChar(next);
            setTimeout(function() { startQuiz(); }, 800);
          }

          function goBack() {
            quizActive = false;
            if (writer) { writer.hideCharacter(); writer = null; }
            document.getElementById('screenTrace').classList.remove('active');
            document.getElementById('screenPicker').classList.remove('hidden');
            document.getElementById('writer-target').innerHTML = '';
          }
          </script>
          </body>
          </html>
          HTMLEOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Black.NoTitleBar.Fullscreen" />
          </resources>
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.hanzi'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.hanzi"
                  minSdk 21; targetSdk 33; versionCode 2; versionName "1.1"
              }
              buildTypes { debug { minifyEnabled false } }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "HanziWriter"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-writer
          path: app/build/outputs/apk/debug/app-debug.apk
