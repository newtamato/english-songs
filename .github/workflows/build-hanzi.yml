              <div class="category-title">📝 常用汉字</div>
              <div class="char-grid" id="gridCommon"></div>
            </div>
          </div>

          <!-- SCREEN 2: Tracing -->
          <div class="screen-trace" id="screenTrace">
            <div class="trace-top">
              <button class="back-btn" onclick="goBack()">← 选字</button>
              <span class="trace-char-info"><span id="traceChar">一</span><span class="py" id="tracePy"></span></span>
              <span class="stroke-counter" id="strokeCounter"></span>
            </div>
            <div class="canvas-wrap">
              <div class="grid-layer"></div>
              <div class="grid-x1"></div>
              <div class="grid-x2"></div>
              <div class="grid-border"></div>
              <div id="writer-target"></div>
            </div>
            <div class="trace-msg" id="traceMsg"></div>
            <div class="trace-buttons">
              <button class="btn btn-outline" onclick="showAnimation()">🎬 看笔顺</button>
              <button class="btn btn-primary" onclick="startQuiz()">✏️ 开始描红</button>
              <button class="btn btn-clear" onclick="clearDrawing()">🔄 清除</button>
            </div>
          </div>

          <!-- FIREWORKS OVERLAY -->
