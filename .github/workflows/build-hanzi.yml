name: Build Hanzi Writer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create project
        run: |
          PKG=com/happyzh/hanzi
          mkdir -p app/src/main/java/$PKG
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="汉字描红"
                  android:theme="@style/Theme.App"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/$PKG/MainActivity.java << 'JAVAEOF'
          package com.happyzh.hanzi;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.*;
          import android.webkit.*;
          public class MainActivity extends Activity {
              private WebView wv;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  wv = new WebView(this);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setSupportZoom(false);
                  ws.setBuiltInZoomControls(false);
                  ws.setDisplayZoomControls(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.setOnTouchListener(new View.OnTouchListener() {
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          return false;
                      }
                  });
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          JAVAEOF

          cat > app/src/main/assets/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.6/dist/hanzi-writer.min.js"></script>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
          body{background:#f5f0e8;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

          /* ====== SCREEN 1: character picker ====== */
          .screen-picker{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10;transition:transform .4s cubic-bezier(.4,0,.2,1)}
          .screen-picker.hidden{transform:translateX(-100%)}
          .picker-header{background:linear-gradient(135deg,#2c1810,#5c3a21);padding:24px 20px;text-align:center;flex-shrink:0}
          .picker-header h1{color:#f5d6b8;font-size:28px;font-weight:900}
          .picker-header p{color:#b8956e;font-size:13px;margin-top:4px}
          .picker-scroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
          .category-title{color:#5c3a21;font-size:14px;font-weight:700;padding:12px 4px 8px;text-transform:uppercase;letter-spacing:2px}
          .char-grid{display:flex;flex-wrap:wrap;gap:10px}
          .char-card{width:64px;height:64px;border-radius:14px;border:2px solid #d4b896;background:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
          .char-card:active{transform:scale(.92);background:#8b4513;color:#fff;border-color:#8b4513}

          /* ====== SCREEN 2: tracing ====== */
          .screen-trace{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;background:#f5f0e8}
          .screen-trace.active{display:flex}
          .trace-top{display:flex;align-items:center;gap:16px;padding:12px 20px}
          .back-btn{background:#8b4513;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:16px;cursor:pointer}
          .trace-char-info{font-size:22px;color:#5c3a21;font-weight:700}
          .trace-char-info .py{font-size:16px;color:#b8956e;font-weight:400;margin-left:8px}
          .stroke-counter{font-size:14px;color:#8b4513;margin-left:auto}
          .canvas-wrap{position:relative;width:min(340px,85vw);height:min(340px,85vw);touch-action:none}
          .grid-layer{position:absolute;inset:0;pointer-events:none}
          .grid-layer::before,.grid-layer::after{content:'';position:absolute;background:rgba(139,69,19,.12)}
          .grid-layer::before{left:50%;top:0;bottom:0;width:1.5px}
          .grid-layer::after{left:0;right:0;top:50%;height:1.5px}
          .grid-x1,.grid-x2{position:absolute;inset:0;pointer-events:none}
          .grid-x1{background:linear-gradient(to top right,transparent calc(50% - .5px),rgba(139,69,19,.07) 50%,transparent calc(50% + .5px))}
          .grid-x2{background:linear-gradient(to top left,transparent calc(50% - .5px),rgba(139,69,19,.07) 50%,transparent calc(50% + .5px))}
          .grid-border{position:absolute;inset:0;border:2.5px solid #8b4513;border-radius:6px;pointer-events:none}
          #writer-target{position:absolute;inset:0;touch-action:none;display:flex;align-items:center;justify-content:center}
          #writer-target svg{width:100%;height:100%}
          #writer-target svg *{touch-action:none}
          .trace-buttons{display:flex;gap:10px}
          .btn{padding:12px 24px;border-radius:12px;border:none;font-size:17px;font-weight:700;cursor:pointer}
          .btn-outline{background:#fff;border:2px solid #8b4513;color:#8b4513}
          .btn-primary{background:#8b4513;color:#fff}
          .btn-clear{background:#e74c3c;color:#fff}
          .trace-msg{font-size:18px;font-weight:700;min-height:28px;text-align:center}

          /* ====== FIREWORKS ====== */
          .fireworks-overlay{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75)}
          .fireworks-overlay.show{display:flex}
          .fireworks-text{font-size:42px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5);animation:pop .5s ease-out}
          @keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
          .fireworks-sub{font-size:20px;color:#fff;margin:12px 0 24px}
          .fw-buttons{display:flex;gap:16px}
          .fw-btn{padding:16px 32px;border-radius:16px;border:none;font-size:20px;font-weight:700;cursor:pointer;transition:transform .15s}
          .fw-btn:active{transform:scale(.93)}
          .fw-btn-next{background:#ffd700;color:#2c1810}
          .fw-btn-retry{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}

          /* ====== PARTICLES ====== */
          .particle{position:fixed;pointer-events:none;z-index:101;border-radius:50%;animation:boom .8s ease-out forwards}
          @keyframes boom{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}

          /* loading spinner */
          .spinner-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(245,240,232,.8)}
          .spinner-overlay.show{display:flex}
          .spinner{width:40px;height:40px;border:4px solid #d4b896;border-top-color:#8b4513;border-radius:50%;animation:spin .8s linear infinite}
          @keyframes spin{to{transform:rotate(360deg)}}
          </style>
          </head>
          <body>

          <div class="spinner-overlay" id="spinner"><div class="spinner"></div></div>

          <!-- SCREEN 1: Character Picker -->
          <div class="screen-picker" id="screenPicker">
            <div class="picker-header">
              <h1>✍️ 汉字描红</h1>
              <p>选一个字，开始练习</p>
            </div>
            <div class="picker-scroll">
              <div class="category-title">🔢 数字</div>
              <div class="char-grid" id="gridNumbers"></div>
