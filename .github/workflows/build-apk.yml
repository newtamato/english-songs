name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/happyzh/english/songs
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/audio

          cp index.html app/src/main/assets/
          cp manifest.json app/src/main/assets/
          cp sw.js app/src/main/assets/
          cp icon-192.png app/src/main/assets/
          cp icon-512.png app/src/main/assets/
          cp audio/*.m4a app/src/main/assets/audio/

          cat > app/src/main/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Food Songs"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF

          cat > app/src/main/java/com/happyzh/english/songs/MainActivity.java << 'JAVAEOF'
          package com.happyzh.english.songs;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowFileAccessFromFileURLs(true);
                  ws.setAllowUniversalAccessFromFileURLs(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          JAVAEOF

          cat > app/src/main/res/values/styles.xml << 'STYLEEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="android:Theme.Light.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">#FFF8F0</item>
              </style>
          </resources>
          STYLEEOF

          mkdir -p app/src/main/res/mipmap-hdpi
          cp icon-192.png app/src/main/res/mipmap-hdpi/ic_launcher.png

          cat > build.gradle << 'GRADLEEOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLEEOF

          cat > app/build.gradle << 'APPGRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.happyzh.english.songs'
              compileSdk 33
              defaultConfig {
                  applicationId "com.happyzh.english.songs"
                  minSdk 21; targetSdk 33; versionCode 2; versionName "1.1"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          APPGRADLE

          cat > settings.gradle << 'SETEOF'
          rootProject.name = "FoodSongs"
          include ':app'
          SETEOF

          cat > gradle.properties << 'PROPEOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          PROPEOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "APK size:"
          du -sh app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-songs
          path: app/build/outputs/apk/debug/app-debug.apk
