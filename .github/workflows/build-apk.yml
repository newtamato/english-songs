name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          bubblewrap init --manifest="https://raw.githubusercontent.com/newtamato/english-songs/main/manifest.json" --directory twa

      - name: Generate signing key
        run: |
          keytool -genkey -v -keystore twa/release.keystore -alias englishsongs \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=English Songs, OU=Dev, O=Happyzh, L=Beijing, ST=Beijing, C=CN"

      - name: Update signing config
        run: |
          cd twa
          cat > twa-manifest.json << 'ENDMANIFEST'
          {
            "packageId": "com.happyzh.english.songs",
            "host": "newtamato.github.io",
            "name": "English Songs",
            "launcherName": "Food Songs",
            "display": "standalone",
            "themeColor": "#FF6B6B",
            "backgroundColor": "#FFF8F0",
            "startUrl": "/english-songs/",
            "iconUrl": "https://raw.githubusercontent.com/newtamato/english-songs/main/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/newtamato/english-songs/main/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./release.keystore",
              "alias": "englishsongs"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1
          }
          ENDMANIFEST

      - name: Build APK
        run: |
          cd twa
          PASS=android123
          bubblewrap build --storePassword="${PASS}" --keyPassword="${PASS}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-songs-apk
          path: twa/*.apk
