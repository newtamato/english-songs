<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{background:#0a0a1a;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

/* ===== SCREENS ====== */
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:10}
.screen.active{display:flex}

/* ===== CATEGORY SCREEN ====== */
.cat-header{text-align:center;padding:60px 20px 30px;background:linear-gradient(135deg,#1a1a3e,#0d0d2b)}
.cat-header h1{font-size:36px;font-weight:900;color:#fff}
.cat-header h1 span{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cat-header p{color:#8888aa;margin-top:8px;font-size:14px}
.cat-grid{display:flex;gap:24px;padding:40px 20px;max-width:800px;margin:0 auto;flex:1;align-items:center;justify-content:center;flex-wrap:wrap}
.cat-card{width:280px;padding:40px 24px;border-radius:28px;cursor:pointer;transition:transform .15s;text-align:center}
.cat-card:active{transform:scale(.94)}
.cat-card .emoji{font-size:64px;margin-bottom:12px}
.cat-card .name{font-size:24px;font-weight:800;color:#fff}
.cat-card .count{font-size:14px;color:rgba(255,255,255,.7);margin-top:6px}
.cat-card.songs{background:linear-gradient(135deg,#e94560,#c23152)}
.cat-card.books{background:linear-gradient(135deg,#0f3460,#16213e)}

/* ===== LIST SCREEN ====== */
.list-header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#16213e;flex-shrink:0}
.back-btn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:16px;cursor:pointer}
.list-title{font-size:20px;font-weight:700;color:#fff;flex:1}
.list-count{font-size:13px;color:#888}
.list-scroll{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.video-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer;margin-bottom:6px;transition:background .15s}
.video-item:nth-child(odd){background:#16213e}
.video-item:nth-child(even){background:#0f3460}
.video-item:active{background:#533483}
.video-item .num{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#e94560;flex-shrink:0}
.video-item .vname{font-size:16px;color:#eee;line-height:1.4;word-break:break-word}

/* ===== PLAYER SCREEN ====== */
.player-screen{background:#000}
.player-screen video{width:100%;height:100%;object-fit:contain}
.player-top{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.player-top .back-btn{font-size:14px;padding:8px 16px}
.player-title{color:#fff;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-next{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(233,69,96,.9);color:#fff;border:none;padding:12px 24px;border-radius:24px;font-size:16px;font-weight:700;cursor:pointer;z-index:5;display:none}
.player-next.show{display:block}
</style>
</head>
<body>

<!-- CATEGORY SELECTION -->
<div class="screen active" id="screenCat">
  <div class="cat-header">
    <h1><span>英语儿歌绘本</span></h1>
    <p>Songs & Picture Books</p>
  </div>
  <div class="cat-grid">
    <div class="cat-card songs" onclick="showList('songs')">
      <div class="emoji">🎵</div>
      <div class="name">英语儿歌</div>
      <div class="count">20 首</div>
    </div>
    <div class="cat-card books" onclick="showList('books')">
      <div class="emoji">📖</div>
      <div class="name">英语绘本</div>
      <div class="count">AA级 · 97 本</div>
    </div>
  </div>
</div>

<!-- VIDEO LIST -->
<div class="screen" id="screenList">
  <div class="list-header">
    <button class="back-btn" onclick="showCat()">← 返回</button>
    <span class="list-title" id="listTitle"></span>
    <span class="list-count" id="listCount"></span>
  </div>
  <div class="list-scroll" id="listScroll"></div>
</div>

<!-- VIDEO PLAYER -->
<div class="screen player-screen" id="screenPlayer">
  <div class="player-top">
    <button class="back-btn" onclick="stopPlay()">← 列表</button>
    <span class="player-title" id="playerTitle"></span>
  </div>
  <video id="video" controls playsinline></video>
  <button class="player-next" id="nextBtn" onclick="playNext()">⏭ 下一集</button>
</div>

<script>
var VIDEO_LIST = [];
var currentIndex = 0;
var currentCat = '';

var SONGS = [
  "1.Make A Circle","2.Seven Steps","3.One little finger","4.Clean Up Song",
  "5.If You're Happy","6.Days of the Week","7.I See Something Blue",
  "8.Head Shoulders Knees And Toes(Let's Learn)",
  "9.Head Shoulders Knees And Toes(Animals Speeding Up)",
  "10.Head Shoulders Knees And Toes(Let's Sing)","11.Ten In The Bed",
  "12.The Bath Song","13.Five Little Monkeys","14.The Alphabet Song",
  "15.Alphabet Song (Uppercase)","16.I See Something Pink",
  "17.Put On Your Shoes","18.Sweet Dreams","19.Hello","20.Count And Move"
];

var BOOKS = [
  "AA-01Farm Animals","AA-02Go Go Go","AA-03Jump Over","AA-04Pets",
  "AA-05Plains Animals","AA-06Rainforest Animals","AA-07The Coast","AA-08Water",
  "AA-09Spring","AA-10Summer","AA-11It Is Fall","AA-12Winter","AA-13The Ocean",
  "AA-14The Plant","AA-15The Chicken","AA-16These Birds","AA-17Rain on Fairyland",
  "AA-18Jungle Friends","AA-19Animals Nap","AA-20Colorful Eggs","AA-21Purple",
  "AA-22Yellow","AA-23Blue","AA-24Green","AA-25Orange","AA-26Red","AA-27White",
  "AA-28Black","AA-29One","AA-30Two","AA-31Three","AA-32Four","AA-33Five",
  "AA-34Six","AA-35Seven","AA-36Eight","AA-37Nine","AA-38Ten","AA-39Eleven",
  "AA-40Twelve","AA-41Counting Bugs","AA-42One Insect","AA-43Counting Letters",
  "AA-44The Street","AA-45City Street","AA-46The City","AA-47The Playground",
  "AA-48Christmas Eve","AA-49My Hanukkah","AA-50Too Many Sweets","AA-51Lunch at School",
  "AA-52Valentine's Day Gifts","AA-53Pasta!","AA-54My Gift for Mom","AA-55The Garden",
  "AA-56Play Ball!","AA-57The Baseball Game","AA-58The Trip","AA-59The Supermarket",
  "AA-61The School","AA-62The Classroom ","AA-63Summer Camp","AA-64Summer Picnics",
  "AA-65The Post Office","AA-66The Bookstore","AA-67On an Airplane","AA-68The Subway",
  "AA-69At the Lake","AA-70The Backyard","AA-71My School Bus","AA-72Fido Gets Dressed",
  "AA-73Picking Apples","AA-74My Closet","AA-75The Birthday Party","AA-76Show Some Love",
  "AA-77This Kitchen","AA-78My Bath","AA-79Toys","AA-80We Build","AA-81We Go Camping",
  "AA-82The Fort","AA-83My Garden","AA-84The Book","AA-85My Easter","AA-86Mom",
  "AA-87The Movie","AA-88My Family","AA-89Good Night","AA-91Big","AA-92Little",
  "AA-93Under","AA-94On","AA-95In","AA-96Out","AA-97Off","AA-98Over","AA-99The Market"
];

function showCat() {
  hideAll();
  document.getElementById('screenCat').classList.add('active');
  stopPlay();
}

function showList(cat) {
  hideAll();
  currentCat = cat;
  var list = cat === 'songs' ? SONGS : BOOKS;
  var prefix = cat === 'songs' ? 'songs/' : 'books/';
  VIDEO_LIST = list.map(function(name) { return prefix + name + '.mp4'; });

  document.getElementById('listTitle').textContent = cat === 'songs' ? '🎵 英语儿歌' : '📖 英语绘本';
  document.getElementById('listCount').textContent = VIDEO_LIST.length + ' 集';

  var scroll = document.getElementById('listScroll');
  scroll.innerHTML = '';
  VIDEO_LIST.forEach(function(path, i) {
    var name = path.split('/').pop().replace('.mp4','');
    var div = document.createElement('div');
    div.className = 'video-item';
    div.onclick = function() { playVideo(i); };
    div.innerHTML = '<div class="num">'+(i+1)+'</div><div class="vname">'+name+'</div>';
    scroll.appendChild(div);
  });

  document.getElementById('screenList').classList.add('active');
}

function playVideo(index) {
  currentIndex = index;
  hideAll();
  document.getElementById('screenPlayer').classList.add('active');

  var video = document.getElementById('video');
  var name = VIDEO_LIST[index].split('/').pop().replace('.mp4','');
  document.getElementById('playerTitle').textContent = (index+1)+'. '+name;

  video.src = VIDEO_LIST[index];
  video.load();
  video.play().catch(function(){});

  video.onended = function() {
    if (currentIndex < VIDEO_LIST.length - 1) {
      currentIndex++;
      playVideo(currentIndex);
    } else {
      document.getElementById('nextBtn').classList.remove('show');
    }
  };
}

function playNext() {
  document.getElementById('nextBtn').classList.remove('show');
  if (currentIndex < VIDEO_LIST.length - 1) {
    currentIndex++;
    playVideo(currentIndex);
  }
}

function stopPlay() {
  var video = document.getElementById('video');
  video.pause();
  video.src = '';
  showList(currentCat);
}

function hideAll() {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
}
</script>
</body>
</html>
